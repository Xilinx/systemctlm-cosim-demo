#
# To launch this non-CoSim virtual VPK120:
#   runqemu BOOT-versal-vpk120-sdt-seq.qemuboot.conf nographic slirp
#
[config_bsp]
deploy_dir_image = .
image_link_name = BOOT-versal-vpk120-sdt-seg
kernel_imagetype = Image
machine = versal-vpk120-sdt-seg
qb_cmdline_ip_slirp = ip=dhcp
qb_cmdline_ip_tap = ip=192.168.7.@CLIENT@::192.168.7.@GATEWAY@:255.255.255.0::eth0:off:8.8.8.8 net.ifnames=0
qb_default_fstype = wic.qemu-sd
qb_default_kernel = BOOT-versal-vpk120-sdt-seg.bin
qb_drive_type = /dev/sd
qb_dtb = qemu-hw-devicetrees/multiarch/board-versal-ps-vpk120.dtb
qb_graphics =
qb_kernel_cmdline = none
qb_kernel_cmdline_append =  swiotlb=0
qb_machine = -machine arm-generic-fdt
qb_mem = -m 8G
qb_network_device = -net nic,netdev=net0,macaddr=@MAC@ -net nic
qb_nfsrootfs_extra_opt =
qb_no_pni = net.ifnames=0
qb_opt_append =  -serial null -serial null -serial mon:stdio -serial null -nodefaults       -boot mode=5            -plm-args '     -M microblaze-fdt     -device loader,addr=0xf0000000,data=0xba020004,data-len=4     -device loader,addr=0xf0000004,data=0xb800fffc,data-len=4     -device loader,addr=0xF1110624,data=0x0,data-len=4     -device loader,addr=0xF1110620,data=0x1,data-len=4     -hw-dtb @DEPLOY_DIR_IMAGE@/qemu-hw-devicetrees/multiarch/board-versal-pmc-virt.dtb     -display none           -device loader,file=@DEPLOY_DIR_IMAGE@/bootbin/BOOT-versal-vpk120-sdt-seg_bh.bin,addr=0xF201E000,force-raw=on     -device loader,file=@DEPLOY_DIR_IMAGE@/bootbin/pmc_cdo.bin,addr=0xf2000000,force-raw=on     -device loader,file=@DEPLOY_DIR_IMAGE@/bootbin/plm.bin,addr=0xf0200000,force-raw=on,cpu-num=1 '
qb_rng =
qb_rootfs =
qb_rootfs_extra_opt =
qb_rootfs_opt = -drive if=sd,index=1,file=@ROOTFS@,format=raw
qb_serial_opt =
qb_smp =
qb_system_name = qemu-system-aarch64-multiarch
serial_consoles = 115200;ttyAMA0
tune_arch = aarch64
