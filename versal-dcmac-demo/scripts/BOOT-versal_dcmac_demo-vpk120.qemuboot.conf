# Versal DCMAC Demo Launcher for VPK120
#
# Copyright (c) 2026 Advanced Micro Devices, Inc.
# SPDX-License-Identifier: MIT
#
# See README.md for steps to launch this Versal-DCMAC CoSim on virtual VPK120.
#
# This is NOT a complete config file for runqemu, but instead an "overlay"
# over the prebuilt BOOT-versal-vpk120-sdt-seg.setup.sh.
#
# The final complete runqemu-ready config file should be constructed by:
#  (cat ./BOOT-versal_dcmac_demo-vpk120.qemuboo.conf &&
#   sed -e '/^#/d' \
#       -e '/^\[/d' \
#       -e '/^qb_dtb/d' \
#       -e '/^qb_cosim/d' \
#       ./BOOT-versal-vpk120-std-seq.qemuboot.conf)
#
# to prepare the actual BOOT-versal-vpk120-sdt-seg.cosim.qemuboot.conf.
#
# The intent of this file is to capture the additional settings for CoSim to
# avoid having the settings buried inside the setup script.
#
# Note:
# 1. Of the 'rp-chan0=256' option, the value 256 corresponds to
#    versal.user_master[0] in versal_dcmac_demo.cc
# 2. Of the 'rp-chan1=288' option, the value 288 corresponds to
#    versal.user_slave[0] in verssal_dcmac_demo.cc
# 3. The mapping is hard-coded instead of run-time configured, so
#    any changes must be made here as well as in verssal_dcmac_demo.cc
#
[config_bsp]
qb_dtb = qemu-hw-devicetrees/multiarch/board-versal-ps-cosim-vpk120.dtb
qb_cosim = -device remote-port-net,rp-adaptor0=/amba@0/cosim@0,rp-chan0=256,rp-chan1=288,netdev=net4 -netdev user,id=net4,net=192.168.8.0/24
